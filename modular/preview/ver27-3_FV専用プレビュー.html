<body>
<div class="btv3-page">
<header class="btv3-header">
    <div class="btv3-container btv3-header__inner">
      <a class="btv3-brand" href="https://cebu-oyako.com/">
        <span class="btv3-brand__mark btv3-brand__mark--image" aria-hidden="true">
          <img src="../../assets/logo/logo3.png" alt="" width="1254" height="1254">
        </span>
        <span class="btv3-brand__identity">
          <span class="btv3-brand__title">ぶっ飛びセブ島親子留学 <span class="btv3-brand__beta">β版</span></span>
          <small class="btv3-brand__status">ただいまプレオープン中｜体験記事・学校情報を順次公開しています</small>
        </span>
      </a>

      <nav class="btv3-nav" aria-label="メインナビゲーション">
        <a href="#oyako">親子留学</a>
        <a href="#short">短期留学</a>
        <a href="#school">学校選び</a>
        <a href="#cost">費用</a>
        <a href="#voice">体験談</a>
        <a href="#oyako">3回の体験</a>
      </nav>

      <div class="btv3-header-trust" aria-label="仲介なし。親子留学3回の実体験をもとにした情報サイト">
        <span aria-hidden="true">✓</span>
        <p><b>仲介なし</b><small>親子留学3回の実体験</small></p>
      </div>

    </div>

<!-- FV完成画像＋直下CTA（2026-07-23 Jun承認済み） -->
  <section class="btv3-fv-art" aria-label="ぶっ飛びセブ島親子留学">
    <picture class="btv3-fv-art__picture">
      <source media="(max-width:640px)" srcset="../../assets/fv/buttobi-sp2.png">
      <img
        class="btv3-fv-art__image"
        src="../../assets/fv/buttobi.png"
        alt="ぶっ飛びセブ島親子留学。3回行った父の正直なセブ島親子留学ガイド"
        width="1821"
        height="864"
        fetchpriority="high"
        decoding="async">
    </picture>
  </section>

  <section class="btv3-fv-cta" aria-label="はじめに読むコンテンツ">
    <div class="btv3-fv-cta__inner">
      <div class="btv3-fv-cta__intro">
        <span class="btv3-fv-cta__badge">はじめに<br>読む2本</span>
        <p>セブ島親子留学の<strong>全体像</strong>と、<br><strong>3回行った父の実体験</strong>。まずはこの2つから。</p>
      </div>

      <div class="btv3-fv-cta__action">
        <span class="btv3-fv-cta__hint">はじめての方は全体像から</span>
        <span class="btv3-fv-cta__button btv3-fv-cta__button--overview btv3-fv-cta__button--pending" aria-disabled="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5h5.8c1.2 0 2.2.4 2.7 1.2.5-.8 1.5-1.2 2.7-1.2h5.8v13h-5.8c-1.2 0-2.2.4-2.7 1.2-.5-.8-1.5-1.2-2.7-1.2H3.5v-13Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 7v12" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>全体像ガイドへ（予定）</span>
          <i aria-hidden="true">›</i>
        </span>
      </div>

      <div class="btv3-fv-cta__action">
        <span class="btv3-fv-cta__hint">リアルを知るなら体験談へ</span>
        <span class="btv3-fv-cta__button btv3-fv-cta__button--experience btv3-fv-cta__button--pending" aria-disabled="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v10H9l-4.5 3 .8-3H4v-10Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7.5 9h9M7.5 12h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>3回の体験談へ（予定）</span>
          <i aria-hidden="true">›</i>
        </span>
      </div>
    </div>
  </section>

  <!-- 旧FVは復元用にHTMLを温存。表示はhidden＋専用CSSで停止 -->

      <div class="btv3-mother-note__inner">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="3" fill="currentColor"/><circle cx="16.5" cy="9" r="2.2" fill="currentColor" opacity=".75"/><path d="M3.5 19c.5-4.2 2.3-6.5 5.5-6.5s5 2.3 5.5 6.5M13.5 14.2c.8-.8 1.8-1.2 3-1.2 2.4 0 3.7 1.8 4 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>

        <span>授業だけでなく、食事・体調・安全・現地生活まで、親目線で確認できる情報をまとめています。</span>
      </div>
    </div>
  </section>

</div>
