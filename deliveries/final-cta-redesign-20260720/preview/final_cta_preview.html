.btv3-finalcta,.btv3-finalcta *{box-sizing:border-box}.btv3-finalcta{position:relative;isolation:isolate;overflow:hidden;padding:76px 24px 42px;color:var(--btv3-finalcta-white);background:radial-gradient(circle at 12% 18%,var(--btv3-finalcta-white-10) 0 110px,transparent 111px),radial-gradient(circle at 88% 86%,var(--btv3-finalcta-white-10) 0 170px,transparent 171px),linear-gradient(145deg,var(--btv3-finalcta-navy) 0%,var(--btv3-guide-navy,#0b2c86) 54%,var(--btv3-finalcta-blue) 150%)}.btv3-finalcta::before,.btv3-finalcta::after{position:absolute;z-index:-1;width:260px;height:260px;border:1px solid var(--btv3-finalcta-white-16);border-radius:50%;content:""}.btv3-finalcta::before{top:-188px;left:7%}.btv3-finalcta::after{right:5%;bottom:-204px}.btv3-finalcta__inner{width:min(100%,1040px);margin:0 auto;text-align:center}.btv3-finalcta__intro{max-width:820px;margin:0 auto}.btv3-finalcta__eyebrow{display:inline-flex;align-items:center;min-height:30px;margin:0 0 14px!important;padding:3px 15px;border:1px solid var(--btv3-finalcta-white-16);border-radius:999px;color:var(--btv3-finalcta-white-78);background:var(--btv3-finalcta-white-10);font-size:12px;font-weight:600;letter-spacing:.08em!important}.btv3-finalcta__title{margin:0!important;color:var(--btv3-finalcta-white)!important;font-family:var(--btv3-font-head);font-size:clamp(30px,4vw,46px)!important;font-weight:700!important;line-height:1.35!important;letter-spacing:.03em!important;font-feature-settings:"palt"}.btv3-finalcta__lead{margin:18px 0 0!important;color:var(--btv3-finalcta-white-78);font-size:clamp(14px,1.55vw,16px);font-weight:400;line-height:1.95}.btv3-finalcta__sp-break{display:none}.btv3-finalcta__choices{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:38px 0 28px}.btv3-finalcta__choice{position:relative;min-width:0;min-height:170px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:27px 72px 27px 30px;border-radius:var(--btv3-finalcta-radius);text-align:left;text-decoration:none!important;transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease}.btv3-finalcta__choice--primary{color:var(--btv3-finalcta-ink)!important;background:linear-gradient(135deg,var(--btv3-finalcta-yellow),var(--btv3-finalcta-orange));box-shadow:0 12px 30px var(--btv3-finalcta-gold-shadow)}.btv3-finalcta__choice--secondary{border:2px solid var(--btv3-finalcta-white-58);color:var(--btv3-finalcta-white)!important;background:var(--btv3-finalcta-white-10);box-shadow:0 12px 30px var(--btv3-finalcta-navy-shadow)}.btv3-finalcta__choice:hover{transform:translateY(-3px)}.btv3-finalcta__choice--primary:hover{box-shadow:0 16px 34px var(--btv3-finalcta-gold-shadow)}.btv3-finalcta__choice--secondary:hover{background:var(--btv3-finalcta-white-16)}.btv3-finalcta__choice:focus-visible,.btv3-finalcta__general a:focus-visible{outline:3px solid var(--btv3-finalcta-white);outline-offset:4px}.btv3-finalcta__choice-label,.btv3-finalcta__choice-title,.btv3-finalcta__choice-description{display:block}.btv3-finalcta__choice-label{margin-bottom:7px;font-size:12px;font-weight:600;letter-spacing:.05em;opacity:.72}.btv3-finalcta__choice-title{font-family:var(--btv3-font-head);font-size:clamp(19px,2vw,24px);font-weight:700;line-height:1.45;letter-spacing:.02em;font-feature-settings:"palt"}.btv3-finalcta__choice-description{margin-top:8px;font-size:13px;font-weight:400;line-height:1.65;opacity:.82}.btv3-finalcta__choice-arrow{position:absolute;top:50%;right:26px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--btv3-finalcta-white-16);font-size:20px;font-weight:700;transform:translateY(-50%)}.btv3-finalcta__choice--primary .btv3-finalcta__choice-arrow{background:var(--btv3-finalcta-white-58)}.btv3-finalcta__reassurance{display:flex;align-items:center;justify-content:center;gap:9px;margin:0!important;color:var(--btv3-finalcta-white-92);font-size:clamp(14px,1.6vw,16px);font-weight:600;line-height:1.7}.btv3-finalcta__check{width:24px;height:24px;flex:0 0 24px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--btv3-finalcta-ink);background:var(--btv3-finalcta-yellow);font-size:14px;font-weight:700}.btv3-finalcta__general{margin:30px 0 0!important;padding-top:20px;border-top:1px solid var(--btv3-finalcta-white-16);color:var(--btv3-finalcta-white-58);font-size:12.5px;line-height:1.8}.btv3-finalcta__general a{display:inline-block;margin-left:4px;color:var(--btv3-finalcta-white-78)!important;font-weight:600;text-decoration:underline!important;text-decoration-thickness:1px!important;text-underline-offset:4px}@media(max-width:760px){.btv3-finalcta{padding:56px 18px 34px}.btv3-finalcta__choices{grid-template-columns:1fr;gap:13px;margin-top:30px}.btv3-finalcta__choice{min-height:146px}}@media(max-width:480px){.btv3-finalcta{padding-right:16px;padding-left:16px}.btv3-finalcta__eyebrow{font-size:11px}.btv3-finalcta__title{font-size:clamp(27px,8.3vw,33px)!important;line-height:1.42!important}.btv3-finalcta__sp-break{display:initial}.btv3-finalcta__pc-break{display:none}.btv3-finalcta__lead{font-size:13.5px;line-height:1.9}.btv3-finalcta__choice{min-height:0;padding:23px 58px 23px 21px;border-radius:16px}.btv3-finalcta__choice-title{font-size:19px}.btv3-finalcta__choice-description{font-size:12px}.btv3-finalcta__choice-arrow{right:17px;width:32px;height:32px;font-size:17px}.btv3-finalcta__reassurance{align-items:flex-start;text-align:left}.btv3-finalcta__general{margin-top:25px!important}.btv3-finalcta__general a{display:block;margin:3px 0 0}}@media(prefers-reduced-motion:reduce){.btv3-finalcta__choice{transition:none}}

<body>
  <div class="btv3-page">
    <section class="btv3-finalcta" id="contact" aria-labelledby="btv3-finalcta-title">
      <div class="btv3-finalcta__inner">
        <div class="btv3-finalcta__intro">
          <p class="btv3-finalcta__eyebrow">学校一覧と、全10ステップの親子留学ガイド</p>
          <h2 class="btv3-finalcta__title" id="btv3-finalcta-title">「行けるかな？」から、<br>「行ってみよう！」へ。</h2>
          <p class="btv3-finalcta__lead">不安が残るのは、自然なことです。<br>決める前に、まずは家族に合う選択肢を確認してみてください。</p>
        </div>
        <div class="btv3-finalcta__choices" aria-label="親子留学の次のステップ">
          <a class="btv3-finalcta__choice btv3-finalcta__choice--primary" href="https://cebu-oyako.com/oyako-school/">
            <span class="btv3-finalcta__choice-label">学校一覧ページへ</span>
            <span class="btv3-finalcta__choice-title">家族に合う学校を探す</span>
            <span class="btv3-finalcta__choice-description">対象年齢・期間・滞在方法を学校ごとに確認する</span>
            <span class="btv3-finalcta__choice-arrow" aria-hidden="true">→</span>
          </a>
          <a class="btv3-finalcta__choice btv3-finalcta__choice--secondary" href="https://cebu-oyako.com/oyako-ryugaku/">
            <span class="btv3-finalcta__choice-label">全10ステップで解説</span>
            <span class="btv3-finalcta__choice-title">はじめての親子留学ガイド</span>
            <span class="btv3-finalcta__choice-description">費用・学校選び・現地生活・渡航準備まで、順番に確認する</span>
            <span class="btv3-finalcta__choice-arrow" aria-hidden="true">→</span>
          </a>
        </div>
        <p class="btv3-finalcta__reassurance"><span class="btv3-finalcta__check" aria-hidden="true">✓</span>決めるのは、情報がそろってからで大丈夫です。</p>
        <p class="btv3-finalcta__general">社会人・単身での留学をお考えの方は <a href="https://cebu-oyako.com/cebu-ryugaku/">セブ島留学ガイドへ <span aria-hidden="true">→</span></a></p>
      </div>
