:root{
  --btv3-faq-bg-top:#eefaff;
  --btv3-faq-bg-bottom:#f8fcff;
  --btv3-faq-white:#fff;
  --btv3-faq-sparkle:rgba(255,255,255,.92);
  --btv3-faq-sun-glow:rgba(253,196,6,.18);
  --btv3-faq-blue-soft:rgba(1,83,200,.09);
  --btv3-faq-blue-link:rgba(1,83,200,.08);
  --btv3-faq-blue-border:rgba(1,83,200,.28);
  --btv3-faq-blue-border-open:rgba(1,83,200,.32);
  --btv3-faq-focus:rgba(1,83,200,.42);
  --btv3-faq-sun-shadow:rgba(247,166,0,.2);
  --btv3-faq-badge-shadow:rgba(1,83,200,.2);
  --btv3-faq-card-shadow-hover:0 12px 28px rgba(0,87,200,.12);
  --btv3-faq-card-shadow-open:0 13px 30px rgba(0,87,200,.13);
  --btv3-faq-upcoming-bg:#f1f4f7;
  --btv3-faq-upcoming-text:#9aa6b2;
  --btv3-faq-upcoming-line:#e2e8ee;
  --btv3-faq-related-bg:#f4f6f8;
  --btv3-faq-related-text:#667085;
  --btv3-faq-related-line:#e5e7eb;
}
.btv3-faq{
  padding:64px 0 68px;
  background:
    radial-gradient(circle at 13% 12%,var(--btv3-faq-sparkle) 0 3px,transparent 4px),
    radial-gradient(circle at 87% 19%,var(--btv3-faq-sun-glow),transparent 18%),
    linear-gradient(180deg,var(--btv3-faq-bg-top) 0%,var(--btv3-faq-bg-bottom) 100%);
}
.btv3-faq .btv3-container{
  width:min(1040px,calc(100% - 72px));
}
.btv3-faq__head{
  max-width:900px;
  margin:0 auto 30px;
  text-align:center;
}
.btv3-faq__eyebrow{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:28px;
  margin-bottom:9px;
  padding:4px 13px;
  border-radius:999px;
  background:var(--btv3-faq-blue-soft);
  color:var(--btv3-blue);
  font-size:11px;
  font-weight:800;
  letter-spacing:.16em;
}
.btv3-faq__head h2{
  margin:0!important;
  color:var(--btv3-navy2);
  font-family:var(--btv3-font-head);
  font-size:clamp(27px,3vw,40px)!important;
  font-weight:700!important;
  line-height:1.35!important;
}
.btv3-faq__head h2 > span{
  display:inline-block;
  margin-right:8px;
  color:var(--btv3-yellow);
  font-size:.78em;
  filter:drop-shadow(0 3px 5px var(--btv3-faq-sun-shadow));
}
.btv3-faq__head p{
  max-width:820px;
  margin:13px auto 0!important;
  color:var(--btv3-muted);
  font-size:15px;
  font-weight:400;
  line-height:1.85;
}
.btv3-faq__grid{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:14px;
  align-items:start;
  width:100%;
  max-width:960px;
  margin:0 auto;
}
.btv3-faq__item{
  position:relative;
  min-width:0;
  margin:0;
  overflow:hidden;
  border:1px solid var(--btv3-line);
  border-radius:16px;
  background:var(--btv3-faq-white);
  box-shadow:var(--btv3-shadow);
  transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;
}
.btv3-faq__item:hover{
  border-color:var(--btv3-faq-blue-border);
  box-shadow:var(--btv3-faq-card-shadow-hover);
  transform:translateY(-1px);
}
.btv3-faq__item[open]{
  border-color:var(--btv3-faq-blue-border-open);
  box-shadow:var(--btv3-faq-card-shadow-open);
}
.btv3-faq__item > summary{
  position:relative;
  display:grid;
  grid-template-columns:42px minmax(0,1fr) 22px;
  gap:12px;
  align-items:center;
  min-height:80px;
  padding:16px 20px;
  cursor:pointer;
  list-style:none;
  color:var(--btv3-navy2);
}
.btv3-faq__item > summary::-webkit-details-marker{display:none}
.btv3-faq__item > summary:focus-visible{
  outline:3px solid var(--btv3-faq-focus);
  outline-offset:-3px;
  border-radius:15px;
}
.btv3-faq__item > summary::after{
  content:"";
  width:9px;
  height:9px;
  justify-self:center;
  border-right:2px solid var(--btv3-blue);
  border-bottom:2px solid var(--btv3-blue);
  transform:rotate(45deg) translate(-2px,-2px);
  transition:transform .2s ease;
}
.btv3-faq__item[open] > summary::after{
  transform:rotate(225deg) translate(-1px,-1px);
}
.btv3-faq__number{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(145deg,var(--btv3-blue),var(--btv3-blue2));
  color:var(--btv3-faq-white);
  box-shadow:0 6px 13px var(--btv3-faq-badge-shadow);
  font-size:12px;
  font-weight:800;
  letter-spacing:.02em;
}
.btv3-faq__question{
  font-size:16.5px;
  font-weight:700;
  line-height:1.65;
  letter-spacing:.01em;
}
.btv3-faq__answer{
  margin:0 22px 22px 76px;
  padding-top:16px;
  border-top:1px dashed var(--btv3-line);
}
.btv3-faq__lead{
  margin:0!important;
  color:var(--btv3-blue)!important;
  font-size:16px!important;
  font-weight:800!important;
  line-height:1.7!important;
}
.btv3-faq__body{
  margin-top:10px;
  color:var(--btv3-text);
}
.btv3-faq__body p{
  margin:0!important;
  color:var(--btv3-text);
  font-size:14.5px;
  font-weight:400;
  line-height:1.9;
}
.btv3-faq__body p + p{margin-top:.9em!important}
.btv3-faq__body strong{
  color:var(--btv3-navy2);
  font-weight:700;
}
.btv3-faq__related{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin-top:16px;
  padding:11px 14px;
  border:1px solid var(--btv3-faq-related-line);
  border-radius:8px;
  background:var(--btv3-faq-related-bg);
  color:var(--btv3-faq-related-text);
  font-size:13px;
  line-height:1.6;
}
.btv3-faq__related-label{
  flex:0 0 auto;
  font-weight:700;
}
.btv3-faq__related a{
  color:var(--btv3-faq-related-text)!important;
  text-decoration:underline!important;
  text-underline-offset:3px;
}
.btv3-faq__related--pending{
  cursor:default;
}
@media (max-width:760px){
  .btv3-faq{padding:48px 0 52px}
  .btv3-faq .btv3-container{width:min(100% - 32px,1180px)}
  .btv3-faq__head{margin-bottom:23px}
  .btv3-faq__head h2{font-size:clamp(25px,7.4vw,32px)!important}
  .btv3-faq__head p{font-size:14px;line-height:1.8}
  .btv3-faq__grid{grid-template-columns:1fr;gap:12px}
  .btv3-faq__item > summary{grid-template-columns:38px minmax(0,1fr) 18px;gap:10px;min-height:76px;padding:16px 14px}
  .btv3-faq__number{width:38px;height:38px;font-size:11px}
  .btv3-faq__question{font-size:16px;line-height:1.6}
  .btv3-faq__answer{margin:0 16px 20px 64px;padding-top:14px}
  .btv3-faq__lead{font-size:15.5px!important;line-height:1.75!important}
  .btv3-faq__body p{font-size:14px;line-height:1.8}
  .btv3-faq__related{font-size:13px}
}
@media (max-width:420px){
  .btv3-faq .btv3-container{width:calc(100% - 24px)}
  .btv3-faq__answer{margin-left:14px}

@media (prefers-reduced-motion:reduce){
  .btv3-faq__item,
  .btv3-faq__item > summary::after{transition:none}
}

/* ==========================================================
   ver19追記：02 upper-gridのSPはみ出し修正
   既存@media(max-width:1200px)の grid-template-columns:1fr は
   1fr=minmax(auto,1fr)のため中身の最小コンテンツ幅(約390px)まで

  line-height: 1.95;
}

.btv3-finalcta__sp-break {
  display: none;
}

.btv3-finalcta__choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin: 38px 0 28px;
}

.btv3-finalcta__choice {
  position: relative;
  min-width: 0;
  min-height: 170px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: 27px 72px 27px 30px;
  border-radius: var(--btv3-finalcta-radius);
  text-align: left;
  text-decoration: none !important;
  transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease;
}

.btv3-finalcta__choice--primary {
  color: var(--btv3-finalcta-ink) !important;
  background: linear-gradient(135deg, var(--btv3-finalcta-yellow), var(--btv3-finalcta-orange));
  box-shadow: 0 12px 30px var(--btv3-finalcta-gold-shadow);
}

.btv3-finalcta__choice--secondary {
  border: 2px solid var(--btv3-finalcta-white-58);
  color: var(--btv3-finalcta-white) !important;
  background: var(--btv3-finalcta-white-10);
  box-shadow: 0 12px 30px var(--btv3-finalcta-navy-shadow);
}

.btv3-finalcta__choice:hover {
  transform: translateY(-3px);
}

.btv3-finalcta__choice--primary:hover {
  box-shadow: 0 16px 34px var(--btv3-finalcta-gold-shadow);
}

.btv3-finalcta__choice--secondary:hover {
  background: var(--btv3-finalcta-white-16);
}

.btv3-finalcta__choice:focus-visible,
.btv3-finalcta__general a:focus-visible {
  outline: 3px solid var(--btv3-finalcta-white);
  outline-offset: 4px;
}

.btv3-finalcta__choice-label,
.btv3-finalcta__choice-title,
.btv3-finalcta__choice-description {
  display: block;
}

.btv3-finalcta__choice-label {
  margin-bottom: 7px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .05em;
  opacity: .72;
}

.btv3-finalcta__choice-title {
  font-family: var(--btv3-font-head);
  font-size: clamp(19px, 2vw, 24px);
  font-weight: 700;
  line-height: 1.45;
  letter-spacing: .02em;
  font-feature-settings: "palt";
}

.btv3-finalcta__choice-description {
  margin-top: 8px;
  font-size: 13px;
  font-weight: 400;
  line-height: 1.65;
  opacity: .82;
}

.btv3-finalcta__choice-arrow {
  position: absolute;
  top: 50%;
  right: 26px;
  width: 38px;
  height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--btv3-finalcta-white-16);
  font-size: 20px;
  font-weight: 700;
  transform: translateY(-50%);
}

.btv3-finalcta__choice--primary .btv3-finalcta__choice-arrow {
  background: var(--btv3-finalcta-white-58);
}

.btv3-finalcta__reassurance {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  margin: 0 !important;
  color: var(--btv3-finalcta-white-92);
  font-size: clamp(14px, 1.6vw, 16px);
  font-weight: 600;
  line-height: 1.7;
}

.btv3-finalcta__check {
  width: 24px;
  height: 24px;
  flex: 0 0 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  color: var(--btv3-finalcta-ink);
  background: var(--btv3-finalcta-yellow);
  font-size: 14px;
  font-weight: 700;
}

.btv3-finalcta__general {
  margin: 30px 0 0 !important;
  padding-top: 20px;
  border-top: 1px solid var(--btv3-finalcta-white-16);
  color: var(--btv3-finalcta-white-58);
  font-size: 12.5px;
  line-height: 1.8;
}

.btv3-finalcta__general a {
  display: inline-block;
  margin-left: 4px;
  color: var(--btv3-finalcta-white-78) !important;
  font-weight: 600;
  text-decoration: underline !important;
  text-decoration-thickness: 1px !important;
  text-underline-offset: 4px;
}

@media (max-width: 760px) {
  .btv3-finalcta {
    padding: 56px 18px 34px;
  }

  .btv3-finalcta__choices {
    grid-template-columns: 1fr;
    gap: 13px;
    margin-top: 30px;
  }

  .btv3-finalcta__choice {
    min-height: 146px;
  }
}

@media (max-width: 480px) {
  .btv3-finalcta {
    padding-right: 16px;
    padding-left: 16px;
  }

  .btv3-finalcta__eyebrow {
    font-size: 11px;
  }

  .btv3-finalcta__title {
    font-size: clamp(21px, 7.8vw, 30px) !important;
    line-height: 1.42 !important;
  }

  .btv3-finalcta__sp-break {
    display: initial;
  }

  .btv3-finalcta__pc-break {
    display: none;
  }

  .btv3-finalcta__lead {
    font-size: 13.5px;
    line-height: 1.9;
  }

  .btv3-finalcta__choice {
    min-height: 0;
    padding: 23px 58px 23px 21px;
    border-radius: 16px;
  }

  .btv3-finalcta__choice-title {
    font-size: 19px;
  }

  .btv3-finalcta__choice-description {
    font-size: 12px;
  }

  .btv3-finalcta__choice-arrow {
    right: 17px;
    width: 32px;
    height: 32px;
    font-size: 17px;
  }

  .btv3-finalcta__reassurance {
    align-items: flex-start;
    text-align: left;
  }

  .btv3-finalcta__general {
    margin-top: 25px !important;
  }

  .btv3-finalcta__general a {
    display: block;
    margin: 3px 0 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .btv3-finalcta__choice {
    transition: none;
  }
}
